name: Refresh demo TV guide
on:
  schedule:
    - cron: '17 3 * * *' # daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-demo.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add demo
          git diff --cached --quiet || git commit -m "Refresh demo TV guide"
          git push
